name: Probable Octo Engine Tick

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run counter
        run: python counter.py

      - name: Commit and push changes
        run: |
          git config user.name "probable-octo-engine"
          git config user.email "octo@users.noreply.github.com"
          git add counter.txt
          git commit -m "tick: increment counter" || echo "No changes to commit"
          git push

