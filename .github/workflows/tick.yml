name: Probable Octo Engine Tick

permissions:
  contents: write   # allows GitHub Actions to push commits

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_KEY_1: ${{ secrets.OPENROUTER_KEY_1 }}
      OPENROUTER_KEY_2: ${{ secrets.OPENROUTER_KEY_2 }}
      OPENROUTER_KEY_3: ${{ secrets.OPENROUTER_KEY_3 }}
      OPENROUTER_KEY_4: ${{ secrets.OPENROUTER_KEY_4 }}
      OPENROUTER_KEY_5: ${{ secrets.OPENROUTER_KEY_5 }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run brain
        run: python brain.py

      - name: Commit and push changes
        run: |
          git config user.name "probable-octo-engine"
          git config user.email "probable-octo-engine@users.noreply.github.com"
          git add example.py logs/ counter.txt
          git commit -m "tick: AI improved code" || echo "No changes to commit"
          git push
